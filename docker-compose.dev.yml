services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scholarship_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scholarship_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --legacy-watch"
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      PORT: "4000"
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-scholarship_db}?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/auth/google/callback}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8010}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INGESTION_ENABLED: ${INGESTION_ENABLED:-false}
      INGEST_DAAD_ENABLED: ${INGEST_DAAD_ENABLED:-false}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./scholar-backend:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --webpack -H 0.0.0.0 -p 3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: development
      BACKEND_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: ""
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./scholar-f:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  db_data_dev:
  api_node_modules:
  web_node_modules: