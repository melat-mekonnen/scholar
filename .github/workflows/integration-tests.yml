name: Integration Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run End-to-End Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            scholar-backend/package-lock.json
            scholar-f/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install Backend Dependencies
        working-directory: ./scholar-backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./scholar-f
        run: npm ci

      - name: Backend Lint
        working-directory: ./scholar-backend
        run: npm run lint --if-present

      - name: Backend Tests
        working-directory: ./scholar-backend
        run: npm test --if-present

      - name: Frontend Typecheck
        working-directory: ./scholar-f
        run: npx tsc --noEmit

      - name: Run Integration QA Script
        run: python -u qa_integration_test.py

      - name: Upload QA Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            qa-report.json
            scholar-backend/logs
            scholar-f/logs
